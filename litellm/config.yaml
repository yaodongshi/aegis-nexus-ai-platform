general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  alerting:
  - slack
  health_check_interval: 300
router_settings:
  routing_strategy: latency-based-routing
  num_retries: 2
  timeout: 60
  redis_host: null
litellm_settings:
  drop_params: true
  request_timeout: 120
  set_verbose: false
