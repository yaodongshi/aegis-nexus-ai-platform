services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: team-ai-backend:latest
    container_name: team-ai-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TEAM_AI_PLATFORM_PROJECT_NAME: Aegis Nexus AI Platform
      TEAM_AI_PLATFORM_DB_DSN: ${TEAM_AI_PLATFORM_DB_DSN:-postgresql://litellm:litellm_password_change_me@litellm_db:5432/litellm}
      TEAM_AI_PLATFORM_QDRANT_URL: ${TEAM_AI_PLATFORM_QDRANT_URL:-http://qdrant:6333}
    command:
      - /bin/sh
      - -lc
      - pip install --no-cache-dir aiofiles python-multipart && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app/backend
      - ./litellm:/app/litellm
      - ./backend/app/static:/app/backend/app/static
    # 8000 端口仅在内部 Docker 网络可见；外部流量通过 frontend(Nginx):3000 代理
    # ports:
    #   - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - team_ai_net
    depends_on:
      litellm_db:
        condition: service_healthy
      qdrant:
        condition: service_started

  team_ai_mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: team-ai-mcp:latest
    container_name: team-ai-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TEAM_AI_MCP_WORKSPACE: /workspace
      TEAM_AI_PLATFORM_DB_DSN: ${TEAM_AI_PLATFORM_DB_DSN:-postgresql://litellm:litellm_password_change_me@litellm_db:5432/litellm}
      TEAM_AI_PLATFORM_QDRANT_URL: ${TEAM_AI_PLATFORM_QDRANT_URL:-http://qdrant:6333}
    working_dir: /app/backend
    command:
      - /bin/sh
      - -lc
      - pip install --no-cache-dir aiofiles python-multipart && uvicorn mcp_server.http_app:app --host 0.0.0.0 --port 8123
    volumes:
      - ./backend:/app/backend
      - ./:/workspace:ro
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - team_ai_net
    depends_on:
      backend:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: team-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    env_file:
      - .env
      - ./litellm/.env.litellm
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: ${LITELLM_DATABASE_URL}
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_MASTER_KEY}
      STORE_MODEL_IN_DB: "True"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AZURE_API_KEY: ${AZURE_API_KEY}
      AZURE_API_BASE: ${AZURE_API_BASE}
      AZURE_API_VERSION: ${AZURE_API_VERSION}
      # 国内主流供应商
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY}
      STEPFUN_API_KEY: ${STEPFUN_API_KEY}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      BAICHUAN_API_KEY: ${BAICHUAN_API_KEY}
      HUNYUAN_API_KEY: ${HUNYUAN_API_KEY}
      IFLYTEK_API_KEY: ${IFLYTEK_API_KEY}
      BAIDU_API_KEY: ${BAIDU_API_KEY}
      LINGYIWANWU_API_KEY: ${LINGYIWANWU_API_KEY}
      # 国际其他供应商
      GROQ_API_KEY: ${GROQ_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY}
      PERPLEXITYAI_API_KEY: ${PERPLEXITYAI_API_KEY}
      COHERE_API_KEY: ${COHERE_API_KEY}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - litellm_data:/app/data
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      litellm_db:
        condition: service_healthy
    networks:
      - team_ai_net

  litellm_db:
    image: ${LITELLM_DB_IMAGE:-postgres:16}
    container_name: team-litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LITELLM_DB_USER}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
      POSTGRES_DB: ${LITELLM_DB_NAME}
    ports:
      - "55432:5432"
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER} -d ${LITELLM_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - team_ai_net

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    container_name: team-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - team_ai_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: team-ai-frontend:latest
    container_name: team-ai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - team_ai_net

  open_webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:latest}
    container_name: team-open-webui
    restart: unless-stopped
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      WEBUI_AUTH: "True"
    ports:
      - "${OPEN_WEBUI_PORT:-9000}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      backend:
        condition: service_healthy
      litellm:
        condition: service_started
    networks:
      - team_ai_net

volumes:
  litellm_data:
  litellm_db_data:
  qdrant_data:
  open_webui_data:

networks:
  team_ai_net:
    driver: bridge
