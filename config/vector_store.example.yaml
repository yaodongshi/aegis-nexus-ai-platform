# Team AI Platform - Vector Store Management Config (example)
# Copy to config/vector_store.yaml and adjust values for your environment.

backend:
  base_url: "http://localhost:3000"
  # Optional: used by backend /api/* protected endpoints
  admin_token_env: "TEAM_AI_PLATFORM_ADMIN_TOKEN"

litellm:
  base_url: "http://localhost:4000"
  # Required for /v1/embeddings
  master_key_env: "LITELLM_MASTER_KEY"
  embedding_model: "text-embedding-v3"

qdrant:
  base_url: "http://localhost:6333"
  default_collection: "knowledge_base"
  vector_size: 1024
  distance: "Cosine"

workflow:
  # create/manage/test commands in scripts/vector_store_management.sh
  smoke_test_collection: "knowledge_base"
  smoke_test_query: "How to rotate hook secret in team ai platform"
