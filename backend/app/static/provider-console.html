<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Provider Console</title>
  <style>
    :root {
      --bg: #f6f3ea;
      --panel: #fffdfa;
      --ink: #1e1f1a;
      --muted: #686a61;
      --brand: #005f73;
      --brand-2: #0a9396;
      --warn: #bb3e03;
      --ring: rgba(10, 147, 150, 0.25);
      --line: #d6d2c4;
      --ok: #2f6b35;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% -10%, #e9f5f4 0%, transparent 40%),
        radial-gradient(circle at 100% 0%, #fde6cf 0%, transparent 30%),
        var(--bg);
      min-height: 100vh;
    }

    .wrap {
      width: min(1200px, 94vw);
      margin: 28px auto 56px;
    }

    .hero {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #f5fffe;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 95, 115, 0.2);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 36px);
      letter-spacing: 0.4px;
    }

    .hero p {
      margin: 10px 0 0;
      opacity: 0.94;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    @media (max-width: 920px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 14px rgba(30, 31, 26, 0.05);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .row { margin-bottom: 10px; }

    label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      outline: none;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--brand-2);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      border: none;
      background: var(--brand);
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    button.alt { background: #3f3f3a; }
    button.warn { background: var(--warn); }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .pill {
      background: #ecf8f8;
      color: #0b5d60;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      display: inline-block;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .item h3 {
      margin: 0;
      font-size: 16px;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.45;
      word-break: break-all;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .hidden { display: none; }

    .muted { color: var(--muted); }
    .ok { color: var(--ok); }

    #toast {
      margin-top: 12px;
      font-size: 13px;
      min-height: 20px;
    }

    .probe {
      margin-top: 8px;
      padding: 8px;
      border-radius: 10px;
      background: #f4f8ff;
      border: 1px dashed #adc7ff;
      font-size: 12px;
      color: #334155;
      line-height: 1.4;
    }

    .tab-nav {
      display: flex;
      gap: 4px;
      margin-top: 16px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 0;
    }

    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: -2px;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab-btn:hover { color: var(--brand); }

    .tab-btn.active {
      color: var(--brand);
      border-bottom-color: var(--brand);
    }

    .key-reveal {
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 10px;
      padding: 12px 14px;
      font-family: monospace;
      font-size: 14px;
      color: #166534;
      word-break: break-all;
      margin-top: 10px;
    }

    .key-reveal strong { display: block; margin-bottom: 4px; color: #15803d; }

    .copy-btn {
      background: var(--brand-2);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>Provider Console</h1>
      <p>在 Web 里直接管理大模型供应商：预设、统一供应商、自动获取模型，一次配置给多个应用同步。</p>
    </section>

    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="providers">供应商管理</button>
      <button class="tab-btn" data-tab="keys">🔑 Key 管理</button>
    </nav>

    <div id="tab-providers">
    <div class="grid">
      <section class="card">
        <h2>新增供应商</h2>
        <div class="row">
          <label for="preset">预设</label>
          <select id="preset"></select>
        </div>
        <div class="row">
          <label for="name">名称</label>
          <input id="name" placeholder="例如 OpenAI Prod" />
        </div>
        <div class="row">
          <label for="providerType">类型</label>
          <input id="providerType" placeholder="例如 openai" />
        </div>
        <div class="row">
          <label for="baseUrl">端点</label>
          <input id="baseUrl" placeholder="https://api.openai.com" />
        </div>
        <div class="row">
          <label for="apiKey">API Key</label>
          <input id="apiKey" type="password" placeholder="sk-..." />
        </div>
        <div class="row">
          <label for="scope">范围</label>
          <select id="scope">
            <option value="app">应用专属</option>
            <option value="unified">统一供应商</option>
          </select>
        </div>
        <div class="row">
          <label for="apps">绑定应用（逗号分隔）</label>
          <input id="apps" placeholder="open_webui,codex,claude" />
        </div>
        <div class="row">
          <label for="notes">备注</label>
          <textarea id="notes" rows="3" placeholder="可写套餐/用途/到期时间"></textarea>
        </div>
        <div class="row">
          <label for="adminToken">管理员 Token（可选）</label>
          <input id="adminToken" type="password" placeholder="TEAM_AI_PLATFORM_ADMIN_TOKEN" />
        </div>
        <div class="btns">
          <button id="saveTokenBtn" class="alt">保存 Token</button>
          <button id="addBtn">新增供应商</button>
          <button id="cancelEditBtn" class="alt hidden">取消编辑</button>
          <button id="refreshBtn" class="alt">刷新列表</button>
        </div>
        <div id="toast" class="muted"></div>
      </section>

      <section class="card">
        <div class="toolbar">
          <h2 style="margin:0;">供应商列表</h2>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <button id="selectVisibleBtn" class="alt">全选可见</button>
            <button id="clearSelectBtn" class="alt">清空选择</button>
            <button id="batchEnableBtn" class="alt">批量启用</button>
            <button id="batchDisableBtn" class="alt">批量停用</button>
            <button id="batchSyncBtn" class="alt">批量同步应用</button>
            <button id="batchDeleteBtn" class="warn">批量删除</button>
            <button id="probeAllBtn" class="alt">批量测速</button>
            <button id="exportBtn" class="alt">导出 JSON</button>
            <button id="importBtn" class="alt">导入 JSON</button>
            <span id="count" class="pill">0 providers</span>
          </div>
        </div>
        <div class="row">
          <label for="searchInput">搜索</label>
          <input id="searchInput" placeholder="按名称、类型、端点、应用过滤" />
        </div>
        <div id="list" class="list"></div>
        <input id="importFile" class="hidden" type="file" accept="application/json" />
      </section>
    </div>
    </div><!-- /tab-providers -->

    <div id="tab-keys" class="hidden">
      <div class="grid" style="grid-template-columns: 360px 1fr; margin-top: 16px;">
        <section class="card">
          <h2>生成虚拟 Key</h2>
          <div class="row">
            <label for="keyLabel">标签（用途/用户名）</label>
            <input id="keyLabel" placeholder="例如 张三的开发 Key" />
          </div>
          <div class="row">
            <label for="keyExpires">有效天数（0 = 永不过期）</label>
            <input id="keyExpires" type="number" min="0" value="30" />
          </div>
          <div class="btns">
            <button id="issueKeyBtn">生成 Key</button>
            <button id="refreshKeysBtn" class="alt">刷新列表</button>
          </div>
          <div id="keyToast" class="muted" style="margin-top:12px; min-height:20px;"></div>
          <div id="newKeyReveal" class="hidden"></div>
        </section>

        <section class="card">
          <div class="toolbar">
            <h2 style="margin:0;">虚拟 Key 列表</h2>
            <span id="keyCount" class="pill">0 keys</span>
          </div>
          <div id="keyList" class="list" style="margin-top:10px;"></div>
        </section>
      </div>

      <div class="card" style="margin-top:16px; padding:14px 20px;">
        <h2 style="margin:0 0 8px;">💡 LiteLLM 内置管理台</h2>
        <p style="margin:0; color:var(--muted); font-size:14px; line-height:1.6;">
          LiteLLM 提供更完整的 <strong>用户管理、Team 管理、用量统计</strong>：
          访问 <a href="http://localhost:4000/ui" target="_blank" style="color:var(--brand-2);">http://localhost:4000/ui</a>，
          用户名 <code>admin</code>，密码填写 <code>.env</code> 里的 <code>LITELLM_MASTER_KEY</code>。
        </p>
      </div>
    </div><!-- /tab-keys -->
  </div>

  <script>
    const presetSelect = document.getElementById("preset");
    const nameInput = document.getElementById("name");
    const providerTypeInput = document.getElementById("providerType");
    const baseUrlInput = document.getElementById("baseUrl");
    const apiKeyInput = document.getElementById("apiKey");
    const scopeInput = document.getElementById("scope");
    const appsInput = document.getElementById("apps");
    const notesInput = document.getElementById("notes");
    const adminTokenInput = document.getElementById("adminToken");
    const saveTokenBtn = document.getElementById("saveTokenBtn");
    const toast = document.getElementById("toast");
    const listBox = document.getElementById("list");
    const count = document.getElementById("count");
    const searchInput = document.getElementById("searchInput");
    const addBtn = document.getElementById("addBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const importFile = document.getElementById("importFile");

    let presets = [];
    let providers = [];
    let visibleProviders = [];
    let selectedProviderIds = new Set();
    let editingProviderId = null;

    function getAdminToken() {
      return adminTokenInput.value.trim();
    }

    function withAdminHeaders(headers = {}) {
      const token = getAdminToken();
      if (!token) return headers;
      return {
        ...headers,
        "X-Admin-Token": token,
      };
    }

    async function apiFetch(url, options = {}) {
      const merged = { ...options };
      merged.headers = withAdminHeaders(options.headers || {});
      return fetch(url, merged);
    }

    function message(text, isError = false) {
      toast.textContent = text;
      toast.className = isError ? "" : "ok";
      if (isError) toast.style.color = "#bb3e03";
      else toast.style.color = "#2f6b35";
    }

    function parseApps(value) {
      return value
        .split(",")
        .map(v => v.trim())
        .filter(Boolean);
    }

    function pickPreset(key) {
      const target = presets.find(item => item.key === key);
      if (!target) return;
      providerTypeInput.value = target.provider_type;
      baseUrlInput.value = target.default_base_url;
      if (!nameInput.value) nameInput.value = target.name;
      if (!appsInput.value) appsInput.value = (target.suggested_apps || []).join(",");
    }

    async function loadPresets() {
      const resp = await apiFetch("/api/providers/presets");
      if (!resp.ok) throw new Error("加载预设失败");
      presets = await resp.json();
      presetSelect.innerHTML = "";
      presets.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item.key;
        opt.textContent = `${item.name} (${item.provider_type})`;
        presetSelect.appendChild(opt);
      });
      if (presets.length > 0) pickPreset(presets[0].key);
    }

    function row(provider) {
      const div = document.createElement("div");
      div.className = "item";
      const apps = (provider.apps || []).join(", ") || "-";
      const stateLabel = provider.enabled ? "enabled" : "disabled";
      div.innerHTML = `
        <div class="item-head">
          <div style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" class="row-select" data-id="${provider.id}" ${selectedProviderIds.has(provider.id) ? "checked" : ""} />
            <h3>${provider.name}</h3>
          </div>
          <span class="pill">${provider.scope} · ${stateLabel}</span>
        </div>
        <div class="meta">
          <div><strong>Type:</strong> ${provider.provider_type}</div>
          <div><strong>Base:</strong> ${provider.base_url}</div>
          <div><strong>Apps:</strong> ${apps}</div>
          <div><strong>Key:</strong> ${provider.api_key_masked || "-"}</div>
        </div>
        <div class="actions">
          <button data-op="edit" data-id="${provider.id}" class="alt">编辑</button>
          <button data-op="toggle" data-id="${provider.id}" class="alt">${provider.enabled ? "停用" : "启用"}</button>
          <button data-op="probe" data-id="${provider.id}" class="alt">测速</button>
          <button data-op="history" data-id="${provider.id}" class="alt">历史</button>
          <button data-op="discover" data-id="${provider.id}">获取模型</button>
          <button data-op="sync" data-id="${provider.id}" class="alt">保存并同步</button>
          <button data-op="delete" data-id="${provider.id}" class="warn">删除</button>
        </div>
        <div id="probe-${provider.id}" class="probe hidden"></div>
      `;
      return div;
    }

    function filterProviders(allItems) {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) return allItems;
      return allItems.filter((item) => {
        const hay = [
          item.name,
          item.provider_type,
          item.base_url,
          item.scope,
          ...(item.apps || []),
        ]
          .join(" ")
          .toLowerCase();
        return hay.includes(q);
      });
    }

    function renderProviders() {
      const filtered = filterProviders(providers);
      visibleProviders = filtered;
      count.textContent = `${filtered.length}/${providers.length} providers · selected ${selectedProviderIds.size}`;
      listBox.innerHTML = "";
      filtered.forEach((item) => listBox.appendChild(row(item)));
    }

    function resetForm() {
      nameInput.value = "";
      providerTypeInput.value = "";
      baseUrlInput.value = "";
      apiKeyInput.value = "";
      appsInput.value = "";
      notesInput.value = "";
      scopeInput.value = "app";
      editingProviderId = null;
      addBtn.textContent = "新增供应商";
      cancelEditBtn.classList.add("hidden");
      if (presets.length > 0) {
        presetSelect.value = presets[0].key;
        pickPreset(presets[0].key);
      }
    }

    function startEdit(providerId) {
      const item = providers.find((p) => p.id === providerId);
      if (!item) return;
      editingProviderId = item.id;
      nameInput.value = item.name || "";
      providerTypeInput.value = item.provider_type || "";
      baseUrlInput.value = item.base_url || "";
      appsInput.value = (item.apps || []).join(",");
      notesInput.value = item.notes || "";
      scopeInput.value = item.scope || "app";
      addBtn.textContent = "保存修改";
      cancelEditBtn.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
      message(`正在编辑: ${item.name}`);
    }

    async function loadProviders() {
      const resp = await apiFetch("/api/providers?limit=200&offset=0");
      if (!resp.ok) throw new Error("加载供应商失败");
      const payload = await resp.json();
      providers = payload.items || [];
      const existingIds = new Set(providers.map((item) => item.id));
      selectedProviderIds = new Set([...selectedProviderIds].filter((id) => existingIds.has(id)));
      renderProviders();
    }

    function selectedIds() {
      return [...selectedProviderIds];
    }

    async function batchUpdateProviders(updatePayload, successPrefix) {
      const ids = selectedIds();
      if (!ids.length) {
        message("请先选择至少一个供应商", true);
        return;
      }
      const resp = await apiFetch("/api/providers/batch-update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ provider_ids: ids, ...updatePayload }),
      });
      if (!resp.ok) {
        const detail = await resp.text();
        throw new Error(`批量更新失败: ${detail}`);
      }
      const payload = await resp.json();
      message(`${successPrefix}: ${payload.updated}/${payload.total}`);
      await loadProviders();
    }

    async function batchDeleteProviders() {
      const ids = selectedIds();
      if (!ids.length) {
        message("请先选择至少一个供应商", true);
        return;
      }
      const ok = confirm(`确认删除选中的 ${ids.length} 个供应商？此操作不可撤销。`);
      if (!ok) return;

      const resp = await apiFetch("/api/providers/batch-delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ provider_ids: ids }),
      });
      if (!resp.ok) {
        const detail = await resp.text();
        throw new Error(`批量删除失败: ${detail}`);
      }
      const payload = await resp.json();
      selectedProviderIds.clear();
      message(`批量删除完成: ${payload.deleted}/${payload.total}`);
      await loadProviders();
    }

    async function addProvider() {
      const body = {
        name: nameInput.value.trim(),
        provider_type: providerTypeInput.value.trim(),
        base_url: baseUrlInput.value.trim(),
        preset_key: presetSelect.value || null,
        scope: scopeInput.value,
        apps: parseApps(appsInput.value),
        api_format: "openai",
        notes: notesInput.value.trim() || null,
        enabled: true,
        metadata: {},
      };
      const apiKey = apiKeyInput.value.trim();
      if (!body.name || !body.provider_type || !body.base_url) {
        message("请填写名称/类型/端点", true);
        return;
      }

      if (editingProviderId) {
        if (apiKey) body.api_key = apiKey;
        const resp = await apiFetch(`/api/providers/${editingProviderId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          const detail = await resp.text();
          throw new Error(`保存失败: ${detail}`);
        }
        message("保存成功");
      } else {
        if (!apiKey) {
          message("新增时必须填写 API Key", true);
          return;
        }
        body.api_key = apiKey;
        const resp = await apiFetch("/api/providers", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          const detail = await resp.text();
          throw new Error(`新增失败: ${detail}`);
        }
        message("新增成功");
      }
      resetForm();
      await loadProviders();
    }

    async function discover(providerId) {
      const resp = await apiFetch(`/api/providers/${providerId}/discover-models`, { method: "POST" });
      if (!resp.ok) {
        const detail = await resp.text();
        throw new Error(`获取模型失败: ${detail}`);
      }
      const payload = await resp.json();
      message(`发现 ${payload.models.length} 个模型: ${payload.models.slice(0, 8).join(", ")}`);
    }

    async function syncProvider(providerId) {
      const apps = prompt("同步到哪些应用？逗号分隔", "open_webui,codex");
      if (apps === null) return;
      const resp = await apiFetch(`/api/providers/${providerId}/sync`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ target_apps: parseApps(apps) }),
      });
      if (!resp.ok) {
        const detail = await resp.text();
        throw new Error(`同步失败: ${detail}`);
      }
      message("同步成功");
      await loadProviders();
    }

    async function removeProvider(providerId) {
      if (!confirm("确认删除这个供应商？")) return;
      const resp = await apiFetch(`/api/providers/${providerId}`, { method: "DELETE" });
      if (!resp.ok) {
        const detail = await resp.text();
        throw new Error(`删除失败: ${detail}`);
      }
      message("删除成功");
      await loadProviders();
    }

    function renderProbe(providerId, payload) {
      const panel = document.getElementById(`probe-${providerId}`);
      if (!panel) return;
      const rows = (payload.results || []).map((item) => {
        const mark = item.ok ? "OK" : "FAIL";
        const code = item.status_code === null ? "-" : item.status_code;
        const latency = item.latency_ms === null ? "-" : `${item.latency_ms}ms`;
        const err = item.error ? ` (${item.error})` : "";
        return `${mark} | ${item.endpoint} | ${latency} | ${code}${err}`;
      });
      panel.textContent = `best: ${payload.best_endpoint || "none"}\n${rows.join("\n")}`;
      panel.classList.remove("hidden");
    }

    async function probeProvider(providerId) {
      const target = providers.find((item) => item.id === providerId);
      if (!target) return;
      const raw = prompt(
        "输入要测速的端点（逗号分隔），留空则只测当前 base_url",
        `${target.base_url},${target.base_url.replace(/\/$/, "")}/v1`
      );
      if (raw === null) return;
      const endpoints = raw
        .split(",")
        .map((v) => v.trim())
        .filter(Boolean);
      const resp = await apiFetch(`/api/providers/${providerId}/probe`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ endpoints, timeout_ms: 6000 }),
      });
      if (!resp.ok) {
        const detail = await resp.text();
        throw new Error(`测速失败: ${detail}`);
      }
      const payload = await resp.json();
      renderProbe(providerId, payload);
      if (payload.best_endpoint && payload.best_endpoint !== target.base_url) {
        const apply = confirm(`最快端点: ${payload.best_endpoint}，是否更新为当前供应商 base_url?`);
        if (apply) {
          const patchResp = await apiFetch(`/api/providers/${providerId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ base_url: payload.best_endpoint }),
          });
          if (!patchResp.ok) {
            const detail = await patchResp.text();
            throw new Error(`更新端点失败: ${detail}`);
          }
          message("已应用最快端点");
          await loadProviders();
          return;
        }
      }
      message("测速完成");
    }

    async function probeAllProviders() {
      const apply = confirm("批量测速后是否自动应用每个供应商的最快端点？");
      const resp = await apiFetch("/api/providers/probe-all", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ provider_ids: [], timeout_ms: 6000, apply_best_endpoint: apply }),
      });
      if (!resp.ok) {
        const detail = await resp.text();
        throw new Error(`批量测速失败: ${detail}`);
      }
      const payload = await resp.json();
      const lines = (payload.items || []).slice(0, 8).map((item) => {
        const first = item.results && item.results[0] ? item.results[0] : null;
        const latency = first && first.latency_ms !== null ? `${first.latency_ms}ms` : "-";
        return `${item.provider_name}: ${item.best_endpoint || "none"} (${latency})${item.applied ? " [applied]" : ""}`;
      });
      message(`批量测速完成 ${payload.succeeded}/${payload.total}。${lines.join(" | ")}`);
      await loadProviders();
    }

    async function showProbeHistory(providerId) {
      const resp = await apiFetch(`/api/providers/${providerId}/probe-history?limit=5`);
      if (!resp.ok) {
        const detail = await resp.text();
        throw new Error(`读取历史失败: ${detail}`);
      }
      const payload = await resp.json();
      const panel = document.getElementById(`probe-${providerId}`);
      if (!panel) return;
      if (!payload.length) {
        panel.textContent = "暂无测速历史";
        panel.classList.remove("hidden");
        return;
      }
      const rows = payload.map((item) => {
        const first = item.results && item.results[0] ? item.results[0] : null;
        const latency = first && first.latency_ms !== null ? `${first.latency_ms}ms` : "-";
        return `${item.probed_at} | best=${item.best_endpoint || "none"} | ${latency}`;
      });
      panel.textContent = rows.join("\n");
      panel.classList.remove("hidden");
    }

    async function toggleProvider(providerId) {
      const target = providers.find((item) => item.id === providerId);
      if (!target) return;
      const resp = await apiFetch(`/api/providers/${providerId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: !target.enabled }),
      });
      if (!resp.ok) {
        const detail = await resp.text();
        throw new Error(`切换状态失败: ${detail}`);
      }
      message(`已${target.enabled ? "停用" : "启用"}`);
      await loadProviders();
    }

    function exportProviders() {
      const blob = new Blob([JSON.stringify(providers, null, 2)], { type: "application/json" });
      const href = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = href;
      anchor.download = `providers-export-${new Date().toISOString().replace(/[:.]/g, "-")}.json`;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(href);
      message("导出成功");
    }

    async function importProviders(file) {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const items = Array.isArray(parsed) ? parsed : [];
      if (!items.length) {
        message("导入文件为空", true);
        return;
      }

      let created = 0;
      for (const item of items) {
        if (!item.name || !item.provider_type || !item.base_url) continue;
        const payload = {
          name: item.name,
          provider_type: item.provider_type,
          base_url: item.base_url,
          api_key: "sk-import-required-change-me",
          preset_key: item.preset_key || null,
          scope: item.scope || "app",
          apps: Array.isArray(item.apps) ? item.apps : [],
          api_format: item.api_format || "openai",
          notes: item.notes || null,
          enabled: item.enabled !== false,
          metadata: item.metadata || {},
        };
        const resp = await apiFetch("/api/providers", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (resp.ok) created += 1;
      }
      await loadProviders();
      message(`导入完成，新增 ${created} 条（API Key 已使用占位值，需逐条更新）`);
    }

    presetSelect.addEventListener("change", (e) => pickPreset(e.target.value));
    addBtn.addEventListener("click", async () => {
      try { await addProvider(); } catch (err) { message(err.message, true); }
    });
    saveTokenBtn.addEventListener("click", () => {
      const token = getAdminToken();
      if (!token) {
        localStorage.removeItem("provider_console_admin_token");
        message("已清除管理员 Token");
        return;
      }
      localStorage.setItem("provider_console_admin_token", token);
      message("管理员 Token 已保存");
    });
    cancelEditBtn.addEventListener("click", () => {
      resetForm();
      message("已取消编辑");
    });
    document.getElementById("refreshBtn").addEventListener("click", async () => {
      try { await loadProviders(); message("已刷新"); } catch (err) { message(err.message, true); }
    });
    document.getElementById("selectVisibleBtn").addEventListener("click", () => {
      visibleProviders.forEach((item) => selectedProviderIds.add(item.id));
      renderProviders();
      message(`已选择 ${selectedProviderIds.size} 个供应商`);
    });
    document.getElementById("clearSelectBtn").addEventListener("click", () => {
      selectedProviderIds.clear();
      renderProviders();
      message("已清空选择");
    });
    document.getElementById("batchEnableBtn").addEventListener("click", async () => {
      try { await batchUpdateProviders({ enabled: true }, "批量启用完成"); } catch (err) { message(err.message, true); }
    });
    document.getElementById("batchDisableBtn").addEventListener("click", async () => {
      try { await batchUpdateProviders({ enabled: false }, "批量停用完成"); } catch (err) { message(err.message, true); }
    });
    document.getElementById("batchSyncBtn").addEventListener("click", async () => {
      const apps = prompt("批量同步到哪些应用？逗号分隔", "open_webui,codex");
      if (apps === null) return;
      try {
        await batchUpdateProviders({ target_apps: parseApps(apps), force_unified: true }, "批量同步完成");
      } catch (err) {
        message(err.message, true);
      }
    });
    document.getElementById("batchDeleteBtn").addEventListener("click", async () => {
      try { await batchDeleteProviders(); } catch (err) { message(err.message, true); }
    });
    document.getElementById("probeAllBtn").addEventListener("click", async () => {
      try { await probeAllProviders(); } catch (err) { message(err.message, true); }
    });
    document.getElementById("exportBtn").addEventListener("click", () => {
      try { exportProviders(); } catch (err) { message(err.message, true); }
    });
    document.getElementById("importBtn").addEventListener("click", () => importFile.click());
    importFile.addEventListener("change", async () => {
      const file = importFile.files && importFile.files[0];
      if (!file) return;
      try { await importProviders(file); } catch (err) { message(err.message, true); }
      importFile.value = "";
    });
    searchInput.addEventListener("input", () => renderProviders());

    listBox.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-op]");
      if (!btn) return;
      const op = btn.getAttribute("data-op");
      const id = btn.getAttribute("data-id");
      try {
        if (op === "discover") await discover(id);
        if (op === "sync") await syncProvider(id);
        if (op === "delete") await removeProvider(id);
        if (op === "edit") startEdit(id);
        if (op === "toggle") await toggleProvider(id);
        if (op === "probe") await probeProvider(id);
        if (op === "history") await showProbeHistory(id);
      } catch (err) {
        message(err.message, true);
      }
    });

    listBox.addEventListener("change", (e) => {
      const target = e.target;
      if (!(target instanceof HTMLInputElement)) return;
      if (!target.classList.contains("row-select")) return;
      const providerId = target.getAttribute("data-id");
      if (!providerId) return;
      if (target.checked) selectedProviderIds.add(providerId);
      else selectedProviderIds.delete(providerId);
      renderProviders();
    });

    // ---- Tab switching ----
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.getAttribute("data-tab");
        document.getElementById("tab-providers").classList.toggle("hidden", tab !== "providers");
        document.getElementById("tab-keys").classList.toggle("hidden", tab !== "keys");
        if (tab === "keys") {
          loadKeys().catch((err) => keyMessage(err.message, true));
        }
      });
    });

    // ---- Key management ----
    const keyToast = document.getElementById("keyToast");
    const keyCount = document.getElementById("keyCount");
    const keyList = document.getElementById("keyList");
    const newKeyReveal = document.getElementById("newKeyReveal");

    function keyMessage(text, isError = false) {
      keyToast.textContent = text;
      keyToast.style.color = isError ? "#bb3e03" : "#2f6b35";
    }

    function renderKeys(keys) {
      keyCount.textContent = `${keys.length} keys`;
      keyList.innerHTML = "";
      if (!keys.length) {
        keyList.innerHTML = `<div class="muted" style="padding:12px;">暂无虚拟 Key</div>`;
        return;
      }
      keys.forEach((k) => {
        const div = document.createElement("div");
        div.className = "item";
        const expires = k.expires_at ? new Date(k.expires_at).toLocaleDateString("zh-CN") : "永不过期";
        const created = k.created_at ? new Date(k.created_at).toLocaleDateString("zh-CN") : "-";
        const maskedKey = k.key_masked || k.key_prefix || (k.key ? k.key.slice(0, 16) + "…" : "-");
        div.innerHTML = `
          <div class="item-head">
            <h3 style="font-size:14px;">${k.label || "(无标签)"}</h3>
            <span class="pill">${expires}</span>
          </div>
          <div class="meta">
            <div><strong>Key：</strong><code>${maskedKey}</code></div>
            <div><strong>创建时间：</strong>${created}</div>
            <div><strong>ID：</strong>${k.id}</div>
          </div>
          <div class="actions">
            <button data-key-op="revoke" data-key-id="${k.id}" class="warn">吊销</button>
          </div>
        `;
        keyList.appendChild(div);
      });
    }

    async function loadKeys() {
      const resp = await apiFetch("/api/keys?limit=200");
      if (!resp.ok) throw new Error("加载 Key 列表失败");
      const payload = await resp.json();
      renderKeys(payload.items || []);
    }

    async function issueKey() {
      const label = document.getElementById("keyLabel").value.trim();
      const expiresDays = parseInt(document.getElementById("keyExpires").value, 10) || 0;
      const body = { label: label || "未命名 Key" };
      if (expiresDays > 0) body.expires_days = expiresDays;
      const resp = await apiFetch("/api/keys/issue", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!resp.ok) {
        const detail = await resp.text();
        throw new Error(`生成失败: ${detail}`);
      }
      const data = await resp.json();
      // Show the key value prominently (only visible once)
      newKeyReveal.classList.remove("hidden");
      newKeyReveal.innerHTML = `
        <div class="key-reveal">
          <strong>⚠️ 请立即复制！此 Key 仅展示一次</strong>
          <code id="newKeyValue">${data.key}</code>
          <br/>
          <button class="copy-btn" onclick="navigator.clipboard.writeText('${data.key}').then(()=>this.textContent='已复制 ✓')">复制 Key</button>
        </div>
      `;
      document.getElementById("keyLabel").value = "";
      keyMessage(`Key 已生成：${data.label}`);
      await loadKeys();
    }

    async function revokeKey(keyId) {
      if (!confirm("确认吊销此 Key？吊销后立即失效。")) return;
      const resp = await apiFetch(`/api/keys/${keyId}`, { method: "DELETE" });
      if (!resp.ok && resp.status !== 204) {
        const detail = await resp.text();
        throw new Error(`吊销失败: ${detail}`);
      }
      keyMessage("Key 已吊销");
      await loadKeys();
    }

    document.getElementById("issueKeyBtn").addEventListener("click", async () => {
      try { await issueKey(); } catch (err) { keyMessage(err.message, true); }
    });
    document.getElementById("refreshKeysBtn").addEventListener("click", async () => {
      try { await loadKeys(); keyMessage("已刷新"); } catch (err) { keyMessage(err.message, true); }
    });
    keyList.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-key-op]");
      if (!btn) return;
      const op = btn.getAttribute("data-key-op");
      const id = btn.getAttribute("data-key-id");
      try {
        if (op === "revoke") await revokeKey(id);
      } catch (err) {
        keyMessage(err.message, true);
      }
    });

    (async function bootstrap() {
      try {
        const savedToken = localStorage.getItem("provider_console_admin_token") || "";
        if (savedToken) {
          adminTokenInput.value = savedToken;
        }
        await loadPresets();
        await loadProviders();
        resetForm();
        message("Provider Console ready");
      } catch (err) {
        message(err.message, true);
      }
    })();
  </script>
</body>
</html>
